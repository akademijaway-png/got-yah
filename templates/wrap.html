<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="{{ app.theme }}" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="{{ app.short_name }}" />
  <title>{{ app.name }}</title>
  <link rel="manifest" href="/a/{{ app.id }}/manifest.json" />
  <link rel="apple-touch-icon" href="/static/forged/{{ app.id }}-192.png" />
  <link rel="icon" href="/static/forged/{{ app.id }}-192.png" />
  <style>
    :root { --theme: {{ app.theme }}; --safe-t: env(safe-area-inset-top, 0px); }
    html, body { height: 100%; height: 100dvh; margin: 0; overflow: hidden; background: #050505; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; color: #fff; }
    #chrome {
      display: flex; align-items: center; gap: 8px;
      padding: calc(var(--safe-t) + 8px) 10px 8px;
      background: #0c0c0c; border-bottom: 1px solid rgba(255,255,255,.08);
      min-height: 56px;
    }
    #chrome.hidden { display: none; }
    button {
      min-width: 44px; min-height: 44px; border: 0; border-radius: 12px;
      background: #1a1a1a; color: #C6FF2E; font-size: 18px;
    }
    #title { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #frame { width: 100%; height: calc(100dvh - 64px - var(--safe-t)); border: 0; background: #fff; }
    #frame.full { height: 100dvh; }
    #block {
      display: none; height: calc(100dvh - 64px - var(--safe-t));
      align-items: center; justify-content: center; flex-direction: column;
      padding: 28px; text-align: center; background: #050505;
    }
    #block.show { display: flex; }
    #block a {
      display: flex; align-items: center; justify-content: center;
      margin-top: 20px; min-height: 56px; padding: 0 22px; border-radius: 16px;
      background: #C6FF2E; color: #050505; font-weight: 800; text-decoration: none;
    }
    #install {
      display: none; position: fixed; left: 12px; right: 12px; bottom: 16px;
      min-height: 56px; border-radius: 16px; background: #C6FF2E; color: #050505;
      font-weight: 800; font-size: 16px; z-index: 5;
    }
    #install.show { display: block; }
  </style>
</head>
<body>
  <div id="chrome">
    <button type="button" id="back" aria-label="Back">‹</button>
    <div id="title">{{ app.name }}</div>
    <button type="button" id="reload" aria-label="Reload">↻</button>
    <button type="button" id="open-ext" aria-label="Open site">↗</button>
  </div>
  <iframe id="frame" src="{{ app.url }}" title="{{ app.name }}" allow="fullscreen; geolocation; microphone; camera; payment"></iframe>
  <div id="block">
    <p style="opacity:.6;letter-spacing:.2em;font-size:11px;text-transform:uppercase">site blocks embed</p>
    <h1 style="margin:10px 0 0;font-size:28px">{{ app.name }}</h1>
    <p style="opacity:.65;max-width:280px;line-height:1.45">This website won’t load inside a frame. Open it — then Add to Home Screen from the browser if you want the icon.</p>
    <a href="{{ app.url }}" rel="noopener">OPEN WEBSITE</a>
  </div>
  <button id="install" type="button">INSTALL {{ app.short_name|upper }}</button>
  <script>
    const APP = {{ app | tojson }};
    const frame = document.getElementById("frame");
    const block = document.getElementById("block");
    const chrome = document.getElementById("chrome");
    const installBtn = document.getElementById("install");
    let deferred = null;

    if (APP.display === "fullscreen") {
      chrome.classList.add("hidden");
      frame.classList.add("full");
    }
    if (APP.frameable === false) {
      frame.style.display = "none";
      block.classList.add("show");
    }

    document.getElementById("back").onclick = () => {
      try { history.back(); } catch (e) {}
    };
    document.getElementById("reload").onclick = () => {
      try { frame.src = APP.url; } catch (e) { location.reload(); }
    };
    document.getElementById("open-ext").onclick = () => {
      location.href = APP.url;
    };

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferred = e;
      installBtn.classList.add("show");
    });
    installBtn.onclick = async () => {
      if (!deferred) return;
      deferred.prompt();
      await deferred.userChoice;
      deferred = null;
      installBtn.classList.remove("show");
    };

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/a/" + APP.id + "/sw.js", { scope: "/a/" + APP.id }).catch(() => {});
    }
  </script>
</body>
</html>
